[project]
name = "recalls"
version = "0.1.0"
description = "Near-real-time consumer recall alerts (FDA Recalls RSS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
recalls = "recalls.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recalls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
